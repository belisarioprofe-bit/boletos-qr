<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletos QR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#1f2937;--muted:#6b7280;--accent:#2c7be5;--ok:#1e7e34;--bad:#b02a37;--border:#e5e7eb;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--border);display:flex;z-index:10;}
header button{flex:1;padding:14px 8px;background:none;border:none;color:var(--muted);font-size:14px;cursor:pointer;border-bottom:3px solid transparent;}
header button.activo{color:var(--accent);border-color:var(--accent);font-weight:bold;}
main{max-width:480px;margin:0 auto;padding:20px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px;}
h2{margin-top:0;font-size:18px;}
label{display:block;font-weight:bold;margin-top:14px;font-size:14px;}
input{width:100%;padding:10px;margin-top:5px;border:1px solid var(--border);border-radius:6px;font-size:15px;}
button.accion{width:100%;margin-top:18px;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer;}
.qrbox{text-align:center;margin-top:14px;padding:14px;border:1px solid var(--border);border-radius:10px;}
.qrbox svg{width:180px;height:180px;}
#video{width:100%;border-radius:10px;background:#000;}
#resEscaneo{margin-top:14px;padding:16px;border-radius:10px;text-align:center;font-size:18px;font-weight:bold;min-height:60px;}
.ok{background:var(--ok);color:#fff;}
.bad{background:var(--bad);color:#fff;}
.neutro{background:var(--border);color:var(--muted);}
table{width:100%;border-collapse:collapse;font-size:14px;}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border);}
.pill{padding:2px 8px;border-radius:10px;font-size:12px;}
.pill.si{background:#d4edda;color:#155724;}
.pill.no{background:#fff3cd;color:#856404;}
small{color:var(--muted);}
#pinOverlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100;}
#pinOverlay .card{width:260px;}
</style>
</head>
<body>
<header>
  <button id="tabGenerar" class="activo" onclick="mostrar('Generar')">Generar</button>
  <button id="tabValidar" onclick="mostrar('Validar')">Validar</button>
  <button id="tabRegistro" onclick="mostrar('Registro')">Registro</button>
</header>
<main>
  <section id="secGenerar">
    <div class="card">
      <h2>Generar código(s)</h2>
      <label>Nombre</label>
      <input id="nombre" placeholder="Nombre de la persona">
      <label>Cantidad de códigos</label>
      <input id="cantidad" type="number" min="1" value="1">
      <button class="accion" onclick="generar()">Generar</button>
    </div>
    <div id="resultadoGenerar"></div>
  </section>

  <section id="secValidar" style="display:none;">
    <div class="card">
      <h2>Escanear en la puerta</h2>
      <video id="video" playsinline muted></video>
      <canvas id="canvas" style="display:none;"></canvas>
      <div id="resEscaneo" class="neutro">Apunta la cámara al código QR</div>
    </div>
  </section>

  <section id="secRegistro" style="display:none;">
    <div class="card">
      <h2>Registro de códigos</h2>
      <table><thead><tr><th>Nombre</th><th>Código</th><th>Usado</th></tr></thead><tbody id="filasRegistro"></tbody></table>
    </div>
  </section>
</main>

<div id="pinOverlay">
  <div class="card">
    <h2>Clave de acceso</h2>
    <input id="pinInput" type="password" placeholder="PIN" inputmode="numeric">
    <button class="accion" onclick="verificarPin()">Entrar</button>
    <div id="pinError" style="color:var(--bad);margin-top:8px;display:none;">PIN incorrecto</div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getFirestore, collection, doc, setDoc, getDoc, updateDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBneQNwMvxmNEWFrF9raVJD_fsx9CfCU34",
    authDomain: "tabla-regalona-calculator.firebaseapp.com",
    projectId: "tabla-regalona-calculator",
    storageBucket: "tabla-regalona-calculator.firebasestorage.app",
    messagingSenderId: "259150659482",
    appId: "1:259150659482:web:49e43da9d4357336b68423"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // ---- CAMBIA ESTE PIN POR EL TUYO ----
  const PIN_SECRETO = "9999";

  window.verificarPin = function () {
    const valor = document.getElementById('pinInput').value;
    if (valor === PIN_SECRETO) {
      localStorage.setItem('pinOk', '1');
      document.getElementById('pinOverlay').style.display = 'none';
      document.getElementById('pinError').style.display = 'none';
    } else {
      document.getElementById('pinError').style.display = 'block';
    }
  };

  function pedirPinSiHaceFalta() {
    if (localStorage.getItem('pinOk') === '1') return true;
    document.getElementById('pinOverlay').style.display = 'flex';
    return false;
  }

  window.mostrar = function (id) {
    if ((id === 'Generar' || id === 'Registro') && !pedirPinSiHaceFalta()) return;
    ['Generar', 'Validar', 'Registro'].forEach(s => {
      document.getElementById('sec' + s).style.display = s === id ? 'block' : 'none';
      document.getElementById('tab' + s).classList.toggle('activo', s === id);
    });
    if (id === 'Validar') iniciarCamara();
  };

  function codigoAleatorio() {
    return 'TKT-' + Math.random().toString(36).substring(2, 8).toUpperCase();
  }

  window.generar = async function () {
    const nombre = document.getElementById('nombre').value.trim();
    const cantidad = parseInt(document.getElementById('cantidad').value, 10) || 1;
    if (!nombre) { alert('Escribe el nombre de la persona.'); return; }
    const cont = document.getElementById('resultadoGenerar');
    cont.innerHTML = 'Generando...';
    const codigos = [];
    for (let i = 0; i < cantidad; i++) {
      const codigo = codigoAleatorio();
      await setDoc(doc(db, 'boletos', codigo), { nombre, fechaCreado: serverTimestamp(), usado: false, fechaUso: null });
      codigos.push(codigo);
    }
    cont.innerHTML = '';
    codigos.forEach(codigo => {
      const qr = qrcode(0, 'M');
      qr.addData(codigo);
      qr.make();
      const div = document.createElement('div');
      div.className = 'qrbox';
      div.innerHTML = qr.createSvgTag({ cellSize: 5, margin: 2 }) + '<div style="margin-top:8px;"><strong>' + codigo + '</strong><br><small>' + nombre + '</small></div>';
      cont.appendChild(div);
    });
    document.getElementById('nombre').value = '';
    document.getElementById('cantidad').value = '1';
  };

  function suscribir() {
    const q = query(collection(db, 'boletos'), orderBy('fechaCreado', 'desc'));
    onSnapshot(q, snap => {
      const filas = document.getElementById('filasRegistro');
      filas.innerHTML = '';
      snap.forEach(d => {
        const b = d.data();
        const tr = document.createElement('tr');
        tr.innerHTML = '<td>' + (b.nombre || '') + '</td><td>' + d.id + '</td><td><span class="pill ' + (b.usado ? 'si' : 'no') + '">' + (b.usado ? 'Sí' : 'No') + '</span></td>';
        filas.appendChild(tr);
      });
    }, err => console.error(err));
  }
  suscribir();

  let camaraIniciada = false, procesando = false;
  function iniciarCamara() {
    if (camaraIniciada) return;
    camaraIniciada = true;
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(stream => {
      video.srcObject = stream;
      video.play();
      requestAnimationFrame(escanear);
    }).catch(err => {
      document.getElementById('resEscaneo').textContent = 'No se pudo acceder a la cámara: ' + err.message;
    });
    function escanear() {
      if (video.readyState === video.HAVE_ENOUGH_DATA && !procesando) {
        canvas.height = video.videoHeight;
        canvas.width = video.videoWidth;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(img.data, img.width, img.height);
        if (code && code.data) { procesando = true; validar(code.data); }
      }
      requestAnimationFrame(escanear);
    }
  }

  async function validar(codigo) {
    const res = document.getElementById('resEscaneo');
    res.className = 'neutro';
    res.textContent = 'Verificando...';
    const ref = doc(db, 'boletos', codigo);
    const snap = await getDoc(ref);
    if (!snap.exists()) {
      res.className = 'bad';
      res.textContent = '🚫 CÓDIGO NO ENCONTRADO';
    } else {
      const b = snap.data();
      if (b.usado) {
        res.className = 'bad';
        res.innerHTML = '🚫 YA INGRESÓ<br><small>' + b.nombre + '</small>';
      } else {
        await updateDoc(ref, { usado: true, fechaUso: serverTimestamp() });
        res.className = 'ok';
        res.innerHTML = '✅ ACCESO PERMITIDO<br><small>' + b.nombre + '</small>';
      }
    }
    setTimeout(() => { res.className = 'neutro'; res.textContent = 'Apunta la cámara al código QR'; procesando = false; }, 2500);
  }

  // Al cargar, si "Generar" (pestaña por defecto) requiere PIN, pedirlo
  pedirPinSiHaceFalta();
</script>
</body>
</html>
